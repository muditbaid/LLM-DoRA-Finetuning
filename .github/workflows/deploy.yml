name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: serml-app
  PROJECT_NUMBER: "437199970190"
  REGION: us-central1
  BACKEND_IMAGE: us-central1-docker.pkg.dev/serml-app/serml-repo/serml-api
  DEPLOY_SERVICE_ACCOUNT: serml-deploy@serml-app.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/437199970190/locations/global/workloadIdentityPools/github-actions/providers/github-main
  FRONTEND_DIR: web app/frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service_url: ${{ steps.deploy.outputs.service_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push immutable backend image
        id: build
        shell: bash
        run: |
          image="${BACKEND_IMAGE}:${GITHUB_SHA}"
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --gcs-source-staging-dir=gs://serml-app_cloudbuild/source \
            --substitutions="_IMAGE=${image}" \
            --project="${PROJECT_ID}" \
            --quiet
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Deploy backend to Cloud Run
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy serml-api \
            --image="${{ steps.build.outputs.image }}" \
            --region="${REGION}" \
            --execution-environment=gen2 \
            --gpu=1 \
            --gpu-type=nvidia-l4 \
            --no-gpu-zonal-redundancy \
            --memory=32Gi \
            --cpu=8 \
            --cpu-boost \
            --no-cpu-throttling \
            --min=0 \
            --max=1 \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=1 \
            --timeout=900 \
            --port=8000 \
            --startup-probe="httpGet.path=/health/ready,httpGet.port=8000,initialDelaySeconds=0,periodSeconds=10,timeoutSeconds=5,failureThreshold=24" \
            --set-env-vars="MODEL_BACKEND=local_inprocess,SYMBOLIC_MOE_DIR=/app/symbolic-moe,MODEL_PRELOAD=true,MODEL_WARMUP=true,BASE_MODEL_PATH=/app/artifacts/base-model,REQUIRE_CUDA=true,APP_ENV=prod,ALLOW_ORIGINS=https://sberhsd.muditb0712.workers.dev" \
            --remove-secrets=HF_TOKEN \
            --service-account="serml-api@${PROJECT_ID}.iam.gserviceaccount.com" \
            --ingress=all \
            --invoker-iam-check \
            --no-allow-unauthenticated \
            --project="${PROJECT_ID}" \
            --quiet

          service_url="$(gcloud run services describe serml-api \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.url)')"
          test -n "${service_url}"
          echo "service_url=${service_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify direct IAP and lock down invocation
        shell: bash
        run: |
          set -euo pipefail
          for principal in allUsers allAuthenticatedUsers; do
            public_member="$(gcloud run services get-iam-policy serml-api \
              --region="${REGION}" \
              --project="${PROJECT_ID}" \
              --flatten="bindings[].members" \
              --filter="bindings.role=roles/run.invoker AND bindings.members=${principal}" \
              --format="value(bindings.members)")"
            if [ -n "${public_member}" ]; then
              gcloud run services remove-iam-policy-binding serml-api \
                --region="${REGION}" \
                --project="${PROJECT_ID}" \
                --member="${principal}" \
                --role=roles/run.invoker \
                --quiet
            fi
          done

          gcloud run services add-iam-policy-binding serml-api \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --member="serviceAccount:service-${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" \
            --role=roles/run.invoker \
            --quiet

          for principal in allUsers allAuthenticatedUsers; do
            public_member="$(gcloud run services get-iam-policy serml-api \
              --region="${REGION}" \
              --project="${PROJECT_ID}" \
              --flatten="bindings[].members" \
              --filter="bindings.role=roles/run.invoker AND bindings.members=${principal}" \
              --format="value(bindings.members)")"
            test -z "${public_member}"
          done

          iap_enabled="$(gcloud run services describe serml-api \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(metadata.annotations['run.googleapis.com/iap-enabled'])")"
          if [ "${iap_enabled}" != "true" ]; then
            echo "Direct Cloud Run IAP is not enabled; complete the documented one-time setup." >&2
            exit 1
          fi

      - name: Wait for model preload
        shell: bash
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe serml-api \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.latestReadyRevisionName)')"
          query="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"serml-api\" AND resource.labels.revision_name=\"${revision}\" AND (jsonPayload.message:\"End-to-end CUDA/Triton warmup inference completed\" OR textPayload:\"End-to-end CUDA/Triton warmup inference completed\")"

          for attempt in $(seq 1 90); do
            match="$(gcloud logging read "${query}" \
              --project="${PROJECT_ID}" \
              --freshness=30m \
              --limit=1 \
              --format='value(timestamp)')"
            if [ -n "${match}" ]; then
              echo "Model preload completed on revision ${revision}."
              exit 0
            fi
            sleep 10
          done

          echo "Model did not become ready within 15 minutes."
          gcloud run services logs read serml-api \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --limit=100
          exit 1

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install and build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_API_BASE_URL: ${{ needs.backend.outputs.service_url }}
          VITE_ENABLE_MOCK_FALLBACK: "false"
        run: |
          test -n "${VITE_API_BASE_URL}"
          npm ci
          npm run build

      - name: Deploy frontend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: ${{ env.FRONTEND_DIR }}
          command: deploy
