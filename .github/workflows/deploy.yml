name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: serml-app
  REGION: us-west1
  REPO: serml-repo
  BACKEND_IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/serml-api
  FRONTEND_DIR: web app/frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Backend
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:latest ${{ env.FRONTEND_DIR }}/../backend
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy serml-api \
            --image=${{ env.BACKEND_IMAGE }}:latest \
            --region=${{ env.REGION }} \
            --gpu=1 --gpu-type=nvidia-l4 \
            --memory=16Gi --cpu=4 \
            --min-instances=0 --max-instances=3 \
            --concurrency=1 --timeout=300 --port=8000 \
            --set-env-vars=MODEL_BACKEND=local_inprocess,SYMBOLIC_MOE_DIR=/app/symbolic-moe,APP_ENV=prod,ALLOW_ORIGINS=https://sberhsd.muditb0712.workers.dev \
            --set-secrets=HF_TOKEN=hf-token:latest \
            --service-account=serml-api@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --ingress=internal-and-cloud-load-balancing \
            --project=${{ env.PROJECT_ID }} \
            --quiet

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install & Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sberhsd
          directory: ${{ env.FRONTEND_DIR }}/dist
          env: |
            VITE_API_BASE_URL=https://serml-api-XXXXX-usw1.a.run.app