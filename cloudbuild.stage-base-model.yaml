steps:
  - id: install-tokenless-downloader-dependencies
    name: python:3.11-slim-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        dependency_dir="/workspace/.stage-python-deps"
        rm -rf -- "$${dependency_dir}"
        python3 -m pip install \
          --disable-pip-version-check \
          --no-cache-dir \
          --target "$${dependency_dir}" \
          "huggingface_hub==0.34.4"

  - id: download-pinned-base-model
    name: python:3.11-slim-bookworm
    entrypoint: bash
    secretEnv:
      - HF_TOKEN
    args:
      - -c
      - |
        set -euo pipefail

        staging_root="/workspace/.stage-base-model"
        snapshot_dir="$${staging_root}/snapshot"
        cache_dir="$${staging_root}/huggingface-cache"
        dependency_dir="/workspace/.stage-python-deps"
        model_repo="meta-llama/Llama-3.1-8B-Instruct"
        model_revision="0e9e39f249a16976918f6564b8830bc894c89659"

        test "$${staging_root}" = "/workspace/.stage-base-model"
        rm -rf -- "$${staging_root}"
        mkdir -p -- "$${snapshot_dir}" "$${cache_dir}"

        test -d "$${dependency_dir}/huggingface_hub"
        export PYTHONPATH="$${dependency_dir}"
        export HF_HOME="$${cache_dir}"
        export HF_HUB_DISABLE_PROGRESS_BARS=1
        export HF_HUB_DISABLE_TELEMETRY=1
        export MODEL_REPO="$${model_repo}"
        export MODEL_REVISION="$${model_revision}"
        : "$${HF_TOKEN:?The hf-token Secret Manager value is empty}"

        python3 - "$${snapshot_dir}" "$${cache_dir}" <<'PY'
        import json
        import os
        import re
        import sys
        from pathlib import Path, PurePosixPath

        from huggingface_hub import hf_hub_download, snapshot_download


        snapshot_dir = Path(sys.argv[1])
        cache_dir = Path(sys.argv[2])
        repo_id = os.environ["MODEL_REPO"]
        revision = os.environ["MODEL_REVISION"]
        token = os.environ["HF_TOKEN"].strip()

        required_runtime_files = [
            "config.json",
            "generation_config.json",
            "model.safetensors.index.json",
            "special_tokens_map.json",
            "tokenizer.json",
            "tokenizer_config.json",
        ]

        index_path = hf_hub_download(
            repo_id=repo_id,
            filename="model.safetensors.index.json",
            revision=revision,
            cache_dir=cache_dir,
            token=token,
        )
        with open(index_path, encoding="utf-8") as index_file:
            index = json.load(index_file)

        weight_map = index.get("weight_map") if isinstance(index, dict) else None
        if not isinstance(weight_map, dict) or not weight_map:
            raise SystemExit("Pinned model index has no non-empty weight_map")

        shard_names = sorted(set(weight_map.values()))
        shard_pattern = re.compile(r"model-\d{5}-of-\d{5}\.safetensors")
        for shard_name in shard_names:
            if not isinstance(shard_name, str):
                raise SystemExit("Pinned model index contains a non-string shard name")
            shard_path = PurePosixPath(shard_name)
            if (
                shard_path.name != shard_name
                or not shard_pattern.fullmatch(shard_name)
            ):
                raise SystemExit(
                    f"Pinned model index contains an unexpected shard path: {shard_name!r}"
                )

        snapshot_download(
            repo_id=repo_id,
            revision=revision,
            local_dir=snapshot_dir,
            cache_dir=cache_dir,
            allow_patterns=required_runtime_files + shard_names,
            token=token,
            max_workers=4,
        )
        PY

        unset HF_TOKEN
        rm -rf -- \
          "$${snapshot_dir}/.cache" \
          "$${snapshot_dir}/.huggingface" \
          "$${cache_dir}"

        unexpected_dir="$$(find "$${snapshot_dir}" -mindepth 1 -type d -print -quit)"
        if [[ -n "$${unexpected_dir}" ]]; then
          echo "Unexpected directory in minimal model snapshot: $${unexpected_dir}" >&2
          exit 1
        fi

        python3 scripts/validate_model_snapshot.py \
          "$${snapshot_dir}" \
          --expected-repo "$${model_repo}" \
          --expected-revision "$${model_revision}" \
          --write-manifest "$${snapshot_dir}/manifest.json"

  - id: upload-and-verify-base-model
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        staging_root="/workspace/.stage-base-model"
        snapshot_dir="$${staging_root}/snapshot"
        remote_snapshot_dir="$${staging_root}/remote-snapshot"
        destination="gs://serml-app-artifacts/artifacts/base-model/0e9e39f249a16976918f6564b8830bc894c89659"
        model_repo="meta-llama/Llama-3.1-8B-Instruct"
        model_revision="0e9e39f249a16976918f6564b8830bc894c89659"
        marker_error="$${staging_root}/marker-describe.err"

        test "$${staging_root}" = "/workspace/.stage-base-model"
        test "$${destination}" = "gs://serml-app-artifacts/artifacts/base-model/0e9e39f249a16976918f6564b8830bc894c89659"
        python3 scripts/validate_model_snapshot.py \
          "$${snapshot_dir}" \
          --expected-repo "$${model_repo}" \
          --expected-revision "$${model_revision}" \
          --require-manifest

        if marker_generation="$$(
          gcloud storage objects describe \
            "$${destination}/.complete" \
            --format='value(generation)' \
            2>"$${marker_error}"
        )"; then
          test -n "$${marker_generation}"
          echo "Immutable model snapshot is already finalized at $${destination}" >&2
          exit 1
        elif ! grep -Fq "not found: 404" "$${marker_error}"; then
          cat "$${marker_error}" >&2
          exit 1
        fi
        rm -f -- "$${marker_error}"

        gcloud storage rsync \
          "$${snapshot_dir}" \
          "$${destination}" \
          --recursive \
          --checksums-only \
          --delete-unmatched-destination-objects

        rm -rf -- "$${remote_snapshot_dir}"
        mkdir -p -- "$${remote_snapshot_dir}"
        gcloud storage rsync \
          "$${destination}" \
          "$${remote_snapshot_dir}" \
          --recursive \
          --checksums-only

        test ! -e "$${remote_snapshot_dir}/.complete"
        unexpected_dir="$$(find "$${remote_snapshot_dir}" -mindepth 1 -type d -print -quit)"
        if [[ -n "$${unexpected_dir}" ]]; then
          echo "Unexpected directory in uploaded model snapshot: $${unexpected_dir}" >&2
          exit 1
        fi
        python3 scripts/validate_model_snapshot.py \
          "$${remote_snapshot_dir}" \
          --expected-repo "$${model_repo}" \
          --expected-revision "$${model_revision}" \
          --require-manifest

        complete_file="$${staging_root}/.complete"
        : >"$${complete_file}"
        gcloud storage cp \
          "$${complete_file}" \
          "$${destination}/.complete" \
          --if-generation-match=0

        marker_size="$$(
          gcloud storage objects describe \
            "$${destination}/.complete" \
            --format='value(size)'
        )"
        if [[ "$${marker_size}" != "0" ]]; then
          echo "Remote completion marker is not empty" >&2
          exit 1
        fi

        rm -rf -- "/workspace/.stage-python-deps" "$${staging_root}"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hf-token/versions/latest
      env: HF_TOKEN

serviceAccount: projects/serml-app/serviceAccounts/serml-build@serml-app.iam.gserviceaccount.com

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
